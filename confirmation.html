<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roamly — Booking Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/theme.js"></script>
<link href="assets/roamly.css" rel="stylesheet">
</head>
<body class="antialiased bg-canvas text-ink min-h-screen flex flex-col items-center justify-center p-6">

<main class="max-w-2xl w-full text-center py-20">

  <div class="relative inline-block mb-12">
    <div class="w-32 h-32 bg-brand rounded-[2.5rem] flex items-center justify-center text-accent text-5xl shadow-brand-lg relative z-10 rotate-3">
      <i class="fa-solid fa-mountain-sun" aria-hidden="true"></i>
    </div>
    <div class="absolute -bottom-2 -right-2 w-32 h-32 bg-accent rounded-[2.5rem] -z-10 rotate-12 opacity-50" aria-hidden="true"></div>
  </div>

  <h1 class="font-display text-5xl md:text-7xl font-extrabold tracking-tighter leading-none mb-6 uppercase">
    Peak <span class="text-brand italic">attained.</span>
  </h1>
  <p class="text-muted text-lg font-medium mb-12 max-w-lg mx-auto" id="lede"></p>

  <!-- Ticket -->
  <section class="bg-surface border border-border-subtle rounded-panel p-10 mb-12 text-left relative overflow-hidden shadow-xl" aria-label="Booking summary">
    <p class="absolute top-0 right-0 px-8 py-3 bg-brand text-accent text-[10px] font-black uppercase tracking-widest rounded-bl-[2rem]">
      Confirmed Extraction
    </p>

    <div class="flex flex-wrap justify-between items-center gap-6 mb-10 pb-10 border-b border-border-subtle">
      <div>
        <p class="text-[9px] font-black uppercase tracking-[0.2em] text-muted mb-2">Booking Reference</p>
        <p class="font-display text-3xl font-black tracking-tighter uppercase" id="ref"></p>
      </div>
      <div class="text-right">
        <p class="text-[9px] font-black uppercase tracking-[0.2em] text-muted mb-2">Status</p>
        <span class="bg-brand text-accent px-4 py-1.5 rounded-full text-[10px] font-black uppercase tracking-widest shadow-brand">In Queue</span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-8 mb-10" id="facts"></div>

    <div class="p-8 bg-ink text-white rounded-[2rem] shadow-xl" id="money"></div>
  </section>

  <div class="flex flex-col sm:flex-row gap-4 items-stretch">
    <a href="my-trip.html" data-keep="my-trip.html"
       class="flex-1 bg-brand text-accent py-5 rounded-[2rem] font-black text-xl uppercase tracking-tighter hover:scale-105 transition-all shadow-brand flex items-center justify-center">
      Access My Log
    </a>
    <div class="flex gap-4 justify-center">
      <button type="button" id="share" class="w-16 h-16 rounded-full border border-border-subtle flex items-center justify-center text-xl hover:bg-brand hover:text-accent transition-all" aria-label="Share on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </button>
      <button type="button" id="print" class="w-16 h-16 rounded-full border border-border-subtle flex items-center justify-center text-xl hover:bg-brand hover:text-accent transition-all" aria-label="Print this confirmation">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </div>

  <a href="index.html" class="inline-block mt-12 text-[10px] font-black uppercase tracking-[0.2em] text-muted hover:text-brand transition-colors">
    Return to Base
  </a>

</main>

<script src="assets/data.js"></script>
<script src="assets/roamly.js"></script>
<script>
(function () {
  'use strict';
  var R = window.Roamly;
  var t = R.trip();
  var s = R.state.get();
  var lead = R.lead();
  var p = R.pickup();
  var ref = R.makeRef();

  document.getElementById('ref').textContent = ref;
  document.getElementById('lede').innerHTML =
    'Your slot on the ' + R.esc(t.name) + ' is secured. Extraction protocols are on the way to ' +
    '<span class="text-brand font-bold">' + R.esc(lead.email || 'your inbox') + '</span>';

  function fact(label, value) {
    return '<div><p class="text-[9px] font-black uppercase tracking-[0.2em] text-muted mb-2">' + label + '</p>' +
      '<p class="font-bold text-sm uppercase">' + value + '</p></div>';
  }
  document.getElementById('facts').innerHTML =
    fact('Target Date', R.esc(s.date || t.dates)) +
    fact('Unit Strength', R.pad(s.pax) + (s.pax === 1 ? ' Person' : ' People')) +
    fact('Extraction', R.esc(p.place)) +
    fact('Reporting', R.esc(p.time));

  var dep = R.deposit(), bal = R.balance();
  document.getElementById('money').innerHTML = dep > 0
    ? '<div class="flex justify-between items-center mb-2">' +
        '<span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/50">Authorized Deposit</span>' +
        '<span class="text-2xl font-display font-black tracking-tighter text-accent tabular-nums">' + R.inr(dep) + '</span></div>' +
      '<div class="flex justify-between items-center text-white/70">' +
        '<span class="text-[9px] font-black uppercase tracking-[0.2em]">Pending Balance</span>' +
        '<span class="text-sm font-bold tabular-nums">' + R.inr(bal) + '</span></div>'
    : '<div class="flex justify-between items-center">' +
        '<span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/50">Amount Due</span>' +
        '<span class="text-2xl font-display font-black tracking-tighter text-accent">Free</span></div>';

  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.getElementById('share').addEventListener('click', function () {
    var msg = 'Booked the ' + t.name + ' with Roamly — ref ' + ref + ', ' + (s.date || t.dates);
    if (navigator.share) {
      navigator.share({ title: 'Roamly booking', text: msg }).catch(function () {});
    } else {
      R.toast('Booking reference copied to clipboard');
      try { navigator.clipboard.writeText(msg); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roamly — Booking Confirmed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="assets/theme.js"></script>
<link href="assets/roamly.css" rel="stylesheet">
</head>
<body class="antialiased bg-canvas text-ink min-h-screen flex flex-col items-center justify-center p-6">

<main class="max-w-2xl w-full text-center py-20">

  <div class="relative inline-block mb-12">
    <div class="w-32 h-32 bg-brand rounded-[2.5rem] flex items-center justify-center text-accent text-5xl shadow-brand-lg relative z-10 rotate-3">
      <i class="fa-solid fa-mountain-sun" aria-hidden="true"></i>
    </div>
    <div class="absolute -bottom-2 -right-2 w-32 h-32 bg-accent rounded-[2.5rem] -z-10 rotate-12 opacity-50" aria-hidden="true"></div>
  </div>

  <h1 class="font-display text-4xl sm:text-5xl md:text-7xl font-extrabold tracking-tighter leading-none mb-4 sm:mb-6 uppercase">
    Peak <span class="text-brand italic">attained.</span>
  </h1>
  <p class="text-muted text-base sm:text-lg font-medium mb-8 sm:mb-12 max-w-lg mx-auto" id="lede"></p>

  <!-- Ticket -->
  <section class="bg-surface border border-border-subtle rounded-panel p-6 sm:p-10 mb-8 sm:mb-12 text-left relative overflow-hidden shadow-xl" aria-label="Booking summary">
    <p class="absolute top-0 right-0 px-6 sm:px-8 py-2.5 sm:py-3 bg-brand text-accent text-[9px] sm:text-[10px] font-black uppercase tracking-widest rounded-bl-2xl sm:rounded-bl-[2rem]">
      Confirmed Booking
    </p>

    <div class="mb-6 sm:mb-8 pb-6 sm:pb-8 border-b border-border-subtle">
      <p class="text-[9px] font-black uppercase tracking-[0.2em] text-muted mb-1.5 sm:mb-2">Booking Reference</p>
      <p class="font-display text-2xl sm:text-3xl font-black tracking-tighter uppercase text-ink" id="ref"></p>
    </div>

    <div class="grid grid-cols-2 gap-4 sm:gap-8 mb-8 sm:mb-10" id="facts"></div>

    <div class="p-5 sm:p-8 bg-ink text-white rounded-2xl sm:rounded-[2rem] shadow-xl" id="money"></div>
  </section>

  <div class="flex flex-col sm:flex-row gap-4 items-stretch">
    <a href="my-trip.html" data-keep="my-trip.html"
       class="flex-1 bg-brand text-accent py-4 sm:py-5 rounded-2xl sm:rounded-[2rem] font-black text-lg sm:text-xl uppercase tracking-tighter hover:scale-105 tx shadow-brand flex items-center justify-center">
      Access My Log
    </a>
    <div class="flex gap-3 sm:gap-4 justify-center">
      <button type="button" id="share" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full border border-border-subtle flex items-center justify-center text-lg sm:text-xl hover:bg-brand hover:text-accent tx" aria-label="Share on WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </button>
      <button type="button" id="print" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full border border-border-subtle flex items-center justify-center text-lg sm:text-xl hover:bg-brand hover:text-accent tx" aria-label="Print this confirmation">
        <i class="fa-solid fa-download"></i>
      </button>
    </div>
  </div>

  <a href="index.html" class="inline-block mt-8 sm:mt-12 text-[10px] font-black uppercase tracking-[0.2em] text-muted hover:text-brand transition-colors">
    Return Home
  </a>

</main>

<script src="assets/data.js"></script>
<script src="assets/roamly.js"></script>
<script>
(function () {
  'use strict';
  var R = window.Roamly;
  var t = R.trip();
  var s = R.state.get();
  var lead = R.lead();
  var p = R.pickup();
  var ref = R.makeRef();

  function formatTripDate(dStr) {
    if (dStr && /\d{1,2}\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)|\d{4}-\d{2}-\d{2}/i.test(dStr)) {
      return dStr;
    }
    var now = new Date();
    var day = now.getDay();
    var daysUntilSat = (6 - day + 7) % 7;
    if (daysUntilSat === 0) daysUntilSat = 7;
    var tripD = new Date(now.getTime() + daysUntilSat * 24 * 60 * 60 * 1000);
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    return days[tripD.getDay()] + ', ' + tripD.getDate() + ' ' + months[tripD.getMonth()] + ' ' + tripD.getFullYear();
  }

  var formattedDate = formatTripDate(s.date);

  document.getElementById('ref').textContent = ref;
  document.getElementById('lede').innerHTML =
    'Your slot on the ' + R.esc(t.name) + ' is secured. Booking details and pickup instructions are on the way to ' +
    '<span class="text-brand font-bold">' + R.esc(lead.email || 'your inbox') + '</span>';

  function fact(label, value) {
    return '<div><p class="text-[9px] font-black uppercase tracking-[0.2em] text-muted mb-2">' + label + '</p>' +
      '<p class="font-bold text-sm uppercase">' + value + '</p></div>';
  }
  document.getElementById('facts').innerHTML =
    fact('Date of Trip', R.esc(formattedDate)) +
    fact('Team Size', R.pad(s.pax) + (s.pax === 1 ? ' Person' : ' People')) +
    fact('Pickup Point', R.esc(p.place)) +
    fact('Reporting Time', R.esc(p.time));

  var isDep = (s.payMode || 'deposit') === 'deposit' && (R.deposit() < R.total());
  var paid = isDep ? R.deposit() : R.total();
  var bal = isDep ? Math.max(0, R.total() - R.deposit()) : 0;

  document.getElementById('money').innerHTML = paid > 0
    ? '<div class="flex justify-between items-center mb-2">' +
        '<span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/50">' + (isDep ? 'Authorized Token Deposit' : 'Amount Paid in Full') + '</span>' +
        '<span class="text-2xl font-display font-black tracking-tighter text-accent tabular-nums">' + R.inr(paid) + '</span></div>' +
      '<div class="flex justify-between items-center text-white/70">' +
        '<span class="text-[9px] font-black uppercase tracking-[0.2em]">' + (isDep ? 'Pending Balance' : 'Remaining Balance') + '</span>' +
        '<span class="text-sm font-bold tabular-nums">' + (isDep ? R.inr(bal) : '₹0 (Settled)') + '</span></div>'
    : '<div class="flex justify-between items-center">' +
        '<span class="text-[10px] font-black uppercase tracking-[0.2em] text-white/50">Amount Due</span>' +
        '<span class="text-2xl font-display font-black tracking-tighter text-accent">Free</span></div>';

  document.getElementById('print').addEventListener('click', function () { window.print(); });
  document.getElementById('share').addEventListener('click', function () {
    var msg = 'Booked the ' + t.name + ' with Roamly — ref ' + ref + ', ' + formattedDate;
    if (navigator.share) {
      navigator.share({ title: 'Roamly booking', text: msg }).catch(function () {});
    } else {
      R.toast('Booking reference copied to clipboard');
      try { navigator.clipboard.writeText(msg); } catch (e) {}
    }
  });
})();
</script>
</body>
</html>
